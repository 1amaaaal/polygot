<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wrapped · Polyglot</title>
  <meta name="description" content="Polyglot Wrapped: your year of guessing programming languages.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/wrapped-page.js"></script>
</head>
<body>
  <main class="page narrow">
    <section class="story" id="story" aria-roledescription="slideshow" aria-label="Polyglot Wrapped">
      <div class="story-progress" id="story-progress" aria-hidden="true"></div>
      <div class="slide" id="slide" aria-live="polite">
        <p class="slide-label" id="slide-kicker"></p>
        <p class="slide-big" id="slide-big"></p>
        <p class="slide-text" id="slide-text"></p>
      </div>
      <div class="story-nav">
        <button class="btn ghost" id="prev-btn" type="button">Back</button>
        <span class="small" id="slide-count"></span>
        <button class="btn primary" id="next-btn" type="button">Next</button>
      </div>
    </section>
    <div class="actions center" id="wrapped-actions" hidden>
      <button class="btn primary" id="share-btn" type="button">Share image</button>
      <button class="btn" id="copy-btn" type="button">Copy summary</button>
      <a class="btn ghost" href="profile.html">Back to profile</a>
    </div>
  </main>
</body>
</html>
