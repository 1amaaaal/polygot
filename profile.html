<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://github.com https://avatars.githubusercontent.com; connect-src 'self' https://inpqowhhemfggcdudvsi.supabase.co; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Polyglot</title>
  <meta name="description" content="Your Polyglot stats, badges and language collection.">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/profile.js"></script>
</head>
<body>
  <main class="page">
    <header class="profile-head" id="identity"></header>

    <section class="section">
      <div class="stat-row" id="stats"></div>
      <p class="muted small" id="arcade-stats"></p>
    </section>

    <a class="wrapped-link" href="wrapped.html" id="wrapped-link">
      <span><b>Polyglot Wrapped</b><span class="muted" id="wrapped-text">Your year in code, in a few slides.</span></span>
      <span aria-hidden="true">→</span>
    </a>

    <section class="section" id="badges">
      <div class="section-head">
        <h2>Badges</h2>
        <p class="muted" id="badge-summary"></p>
      </div>
      <ul class="badge-grid" id="badge-grid"></ul>
    </section>

    <section class="section" id="collection">
      <div class="section-head">
        <h2>Collection</h2>
        <p class="muted" id="collection-summary"></p>
      </div>
      <div class="progress" aria-hidden="true"><div class="progress-bar" id="collection-bar"></div></div>
      <ul class="tiles" id="tiles"></ul>
    </section>

    <section class="section" id="distribution">
      <div class="section-head"><h2>Guess distribution</h2><p class="muted">Daily puzzles only.</p></div>
      <div class="dist" id="dist"></div>
    </section>
  </main>
</body>
</html>
